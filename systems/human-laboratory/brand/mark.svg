<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32" fill="none" role="img" aria-label="The Human Laboratory">
  <!-- The live corner. A bounded thing with one edge promoted a tier.

       Geometry is fixed and pixel-honest: at a 32px render the frame stroke
       spans 4-6 and the accent spans 4-8, both on whole pixels. Changing the
       stroke widths breaks that alignment and the mark softens at small sizes.

       Frame  #3A3A3A  role color-line    1 unit   the edge of the thing
       Corner #DFFF00  role color-accent  2 units  live state

       The 1:2 ratio is the line ladder, not a proportion chosen by eye.

       Role names are written without their leading double hyphen on purpose:
       XML forbids "- -" inside a comment, so spelling a custom property in
       full here makes the file invalid and it stops loading as <img>. -->
  <rect x="5" y="5" width="22" height="22" stroke="#3A3A3A" stroke-width="2"/>
  <path d="M6 14 L6 6 L14 6" stroke="#DFFF00" stroke-width="4" stroke-linecap="butt" stroke-linejoin="miter"/>
</svg>
